name: Atualizar lock de dependências

on:
  push:
    branches:
      - agent/auditoria-dependencias
    paths:
      - package.json
      - .github/workflows/dependency-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: agent/auditoria-dependencias

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerar package-lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Validar instalação limpa
        run: npm ci --ignore-scripts

      - name: Confirmar versões corrigidas
        run: |
          npm ls brace-expansion ip-address --all
          npm audit --json > audit-after.json || true
          node -e "const a=require('./audit-after.json'); const v=a.metadata?.vulnerabilities||{}; console.log('AUDIT_FINAL', JSON.stringify(v)); if ((v.critical||0)>0 || (v.high||0)>2 || (v.moderate||0)>4) process.exit(1)"

      - name: Commitar lock atualizado
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json já está atualizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix: atualizar lock das dependências corrigidas'
          git push origin HEAD:agent/auditoria-dependencias
