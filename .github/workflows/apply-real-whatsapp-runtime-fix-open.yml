name: Apply real WhatsApp runtime fix on reopen

on:
  pull_request:
    types: [reopened]
    branches:
      - agent/etapa-5-ledger-alertas-painel

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/estabilizacao-prod-wppconnect' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Decode and apply corrections
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          source = Path('.github/workflows/apply-real-whatsapp-runtime-fix.yml').read_text(encoding='utf-8')
          payload = source.split("payload = ''.join('''", 1)[1].split("'''.split())", 1)[0]
          payload = ''.join(payload.split())
          script = zlib.decompress(base64.b64decode(payload))
          Path('/tmp/apply-real-whatsapp-runtime-fix.py').write_bytes(script)
          PY
          python /tmp/apply-real-whatsapp-runtime-fix.py

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROME_HEADLESS_SHELL_DOWNLOAD: 'true'
        run: npm ci

      - name: Run full test suite
        run: npm test

      - name: Publish corrected branch
        shell: bash
        run: |
          git rm .github/workflows/apply-real-whatsapp-runtime-fix.yml
          git rm .github/workflows/apply-real-whatsapp-runtime-fix-open.yml
          git rm -f docs/.real-runtime-fix-trigger.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json scripts/test-real-whatsapp-readiness-labels.js \
            src/services/connectionSupervisor.js \
            src/core/connectionSupervisorPreload.js \
            src/services/wppconnectClient.js \
            src/core/requiredLabelsStartup.js \
            src/core/serviceLabels.js \
            src/index.js \
            src/start-with-required-labels.js
          git commit -m "fix: confirmar autenticação real antes do atendimento"
          git push origin "HEAD:${{ github.head_ref }}"
