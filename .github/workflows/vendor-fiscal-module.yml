name: Incorporar módulo fiscal

on:
  push:
    branches:
      - agent/painel-unificado-personalize
    paths:
      - scripts/vendor-fiscal-module.mjs
      - .github/workflows/vendor-fiscal-module.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar PersonalizeProd
        uses: actions/checkout@v4
        with:
          ref: agent/painel-unificado-personalize
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Baixar versão fiscal validada
        run: git clone --depth 1 --branch agent/ui-identidade-personalize https://github.com/EmyCodeIs/PersonalizeNF.git /tmp/PersonalizeNF

      - name: Copiar e integrar módulo fiscal
        run: node scripts/vendor-fiscal-module.mjs /tmp/PersonalizeNF

      - name: Validar sintaxe da integração
        run: |
          node scripts/check-syntax.js
          node scripts/test-fiscal-integration.js

      - name: Publicar na mesma branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "feat: integra sistema fiscal completo ao painel"
          git push origin HEAD:agent/painel-unificado-personalize
