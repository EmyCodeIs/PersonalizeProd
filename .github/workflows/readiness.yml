name: PersonalizeProd Readiness

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

concurrency:
  group: personalizeprod-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22 · npm test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar validação completa
        run: npm test
